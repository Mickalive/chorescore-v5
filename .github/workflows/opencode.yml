name: OpenCode gratuit — mission ChoreScore
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: check = tester le modèle gratuit ; work = poursuivre la mission dans la PR 2
        type: choice
        options:
          - check
          - work
          - audit
          - diagnostic
        default: check
      rounds:
        description: Nombre de passages successifs pour poursuivre le produit (un seul agent à la fois)
        type: choice
        options:
          - '1'
          - '4'
          - '8'
        default: '8'
      audit_ref:
        description: Commit audité sans modifier la branche produit
        type: string
        default: e1d088f9f03ff2b5f4550fcdea340401088e0677
      diagnostic_run:
        description: Mission à diagnostiquer sans modifier le produit
        type: string
        default: '40371273449'
  issue_comment:
    types:
      - created
permissions: {}
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["audit","diagnostic"]'), inputs.mode) &&
    format('chorescore-readonly-{0}', github.run_id) || 'chorescore-opencode-writer' }}
  cancel-in-progress: false
jobs:
  opencode:
    if: >-
      (github.event_name != 'workflow_dispatch' || !contains(fromJSON('["audit","diagnostic"]'), inputs.mode)) &&
      (github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || (contains(fromJSON('[1,2]'),
      github.event.issue.number) &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/opencode'))))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        passage: >-
          ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.mode == 'check' && '[1]' || github.event_name ==
          'workflow_dispatch' && inputs.rounds == '1' && '[1]' || github.event_name == 'workflow_dispatch' && inputs.rounds == '4'
          && '[1,2,3,4]' || '[1,2,3,4,5,6,7,8]') }}
    timeout-minutes: 65
    permissions:
      contents: write
      actions: write
      issues: write
      pull-requests: read
    env:
      MODE: '${{ github.event_name == ''workflow_dispatch'' && inputs.mode || ''work'' }}'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-reconstruction
          fetch-depth: 1
          persist-credentials: false
      - name: Record starting revision
        run: git rev-parse HEAD > "$RUNNER_TEMP/opencode-base-head"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned OpenCode CLI
        run: >
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/opencode-cli"

          curl --fail --location --retry 2
          https://github.com/anomalyco/opencode/releases/download/v1.19.4/opencode-linux-x64.tar.gz -o
          "$RUNNER_TEMP/opencode.tar.gz"

          printf '%s  %s\n' 849bd6b3d959a1d2ef200ed1634a51c79a45ca236aa26665d75debd694805cce "$RUNNER_TEMP/opencode.tar.gz" |
          sha256sum -c -

          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-cli"

          echo "$RUNNER_TEMP/opencode-cli" >> "$GITHUB_PATH"
      - name: Require currently zero-priced model
        run: >
          curl --fail --location
          https://raw.githubusercontent.com/anomalyco/models.dev/dev/providers/opencode/models/big-pickle.toml -o
          "$RUNNER_TEMP/model.toml"

          python3 - <<'PY'

          import os, tomllib

          with open(os.environ['RUNNER_TEMP']+'/model.toml','rb') as file: model=tomllib.load(file)

          assert model['cost']['text']['input']['price']==0, 'Model input is no longer free; stopping'

          assert model['cost']['text']['output']['price']==0, 'Model output is no longer free; stopping'

          print('Big Pickle: input/output price both zero. No paid API credential is supplied.')

          PY
      - name: Verify actual free inference
        timeout-minutes: 5
        run: >
          set -euo pipefail

          opencode --version

          timeout 240 opencode run --model opencode/big-pickle --format json 'Reply exactly OPENCODE_FREE_OK. Do not read or
          modify files. Do not use tools.' | tee "$RUNNER_TEMP/opencode-health.jsonl"

          python3 - <<'PY'

          import json,os

          events=[]

          for line in open(os.environ['RUNNER_TEMP']+'/opencode-health.jsonl'):
            try: events.append(json.loads(line))
            except ValueError: pass
          assert not any(e.get('type')=='error' for e in events), 'OpenCode reported an inference error'

          text=''.join(e.get('part',{}).get('text','') for e in events if e.get('type')=='text')

          assert 'OPENCODE_FREE_OK' in text, 'No actual model response; worker cannot start'

          print('Confirmed: free OpenCode model answered from this GitHub runner.')

          PY
      - name: Prepare dependencies and latest native failure context
        if: env.MODE == 'work'
        env:
          GH_TOKEN: '${{ github.token }}'
        run: >
          set -euo pipefail

          npm ci --no-audit --no-fund

          mkdir -p .opencode-ci

          gh issue view 1 --json title,body,comments > .opencode-ci/issue-1.json

          gh pr view 2 --json title,body,comments > .opencode-ci/pr-2.json

          gh run list --workflow android-apk.yml --branch feat/product-reconstruction --limit 5 --json
          databaseId,status,conclusion,url > .opencode-ci/runs.json

          failed=$(node -e 'const
          a=require("./.opencode-ci/runs.json");process.stdout.write(String(a.find(r=>r.conclusion==="failure")?.databaseId??""))')

          if [ -n "$failed" ]; then
            gh run view "$failed" --log-failed > .opencode-ci/failed.log 2>&1 || true
            gh run download "$failed" --name ChoreScore-Android-evidence --dir .opencode-ci/evidence 2> .opencode-ci/download-error.txt || true
          fi
      - name: Recover diagnostics and unpublished work from the previous failed mission
        if: env.MODE == 'work'
        env:
          GH_TOKEN: '${{ github.token }}'
        run: >
          set -euo pipefail

          python3 - <<'PY'

          import datetime, io, json, os, re, subprocess, zipfile

          from pathlib import Path


          root = Path('.opencode-ci')

          (root/'candidates').mkdir(parents=True, exist_ok=True)

          (root/'current-batch').mkdir(exist_ok=True)

          (root/'previous-worker').mkdir(exist_ok=True)

          repo = os.environ['GITHUB_REPOSITORY']

          current = os.environ.get('RECOVERY_SOURCE_RUN_ID', os.environ['GITHUB_RUN_ID'])

          assert current.isdigit(), 'Invalid source run identifier'


          def api(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+path]))

          def stamp(s):
              return datetime.datetime.fromisoformat(s.replace('Z','+00:00'))

          def quality(job):
              steps = {s['name']:s.get('conclusion') for s in job.get('steps',[])}
              if steps.get('Verify proposed source changes') != 'success': return 0
              if steps.get('Require integrated Firebase emulator journey') == 'success': return 3
              if steps.get('Require hostile writes to be rejected') == 'success': return 2
              return 1

          runs =
          json.loads(subprocess.check_output(['gh','run','list','--workflow','opencode.yml','--limit','40','--json','databaseId,conclusion']))

          ids = [current] + [str(r['databaseId']) for r in runs if r['conclusion'] in ('failure','cancelled') and
          str(r['databaseId']) != current]

          ranked, summary, eligible = [], [], 0

          for run in ids:
              jobs = api(f'actions/runs/{run}/jobs?per_page=100')['jobs']
              work = [j for j in jobs if j['name'].startswith('opencode (')]
              if not work: continue
              good = [j for j in work if quality(j) and j.get('completed_at')]
              summary.extend({'run':run,'job':j['name'],'quality':quality(j),'conclusion':j.get('conclusion')} for j in work)
              if not good: continue
              artifacts = api(f'actions/runs/{run}/artifacts?per_page=100')['artifacts']
              for artifact in artifacts:
                  if artifact['expired'] or not artifact['name'].startswith('OpenCode-worker-evidence') or artifact['size_in_bytes'] > 16*1024*1024: continue
                  created = stamp(artifact['created_at'])
                  for job in good:
                      if stamp(job['started_at']) <= created <= stamp(job['completed_at']) + datetime.timedelta(seconds=5):
                          ranked.append((quality(job),artifact['created_at'],run,job,artifact,artifacts))
              eligible += 1
              if eligible >= 3: break

          choices, logs = [], []

          for score,created,run,job,artifact,artifacts in sorted(ranked,key=lambda x:(x[0],x[1]),reverse=True):
              data = subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{artifact["id"]}/zip'])
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  files=[i for i in z.infolist() if Path(i.filename).name=='opencode-proposed.patch' and 0 < i.file_size <= 8*1024*1024]
                  if not files: continue
                  target=root/'candidates'/f'{run}-{artifact["id"]}.patch'
                  target.write_bytes(z.read(files[0]))
              choice={'run':run,'job':job['name'],'quality':score,'artifact':artifact['id'],'createdAt':created,'patch':str(target)}
              choices.append(choice)
              passage=re.search(r'\((\d+)\)',job['name']).group(1)
              gate=next((a for a in artifacts if a['name']==f'Firestore-security-gate-{passage}' and not a['expired'] and a['size_in_bytes'] < 16*1024*1024),None)
              if gate:
                  raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{gate["id"]}/zip'])
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      for name in z.namelist():
                          if Path(name).name not in ('client-journey.log','execution.log'): continue
                          text=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',z.read(name).decode(errors='replace'))
                          lines=[line for line in text.splitlines() if len(line)<1600 and re.search(r'FAIL|Error|denied|permission|evaluation|Tests:|Test Suites:| at |undefined|Missing',line,re.I)]
                          excerpt='\n'.join(lines[-25:])+'\n'+text[-1200:]
                          logs.append(f'## {run} {job["name"]} {Path(name).name}\n{excerpt}')
              if len(choices)>=3: break

          (root/'repair-selection.json').write_text(json.dumps(choices,indent=2)+'\n')

          (root/'current-batch'/'status.json').write_text(json.dumps(summary,indent=2)+'\n')

          context='# Repair handoff — restore the strongest candidate, not the latest regression\n\nQuality 1 = source tests
          passed; 2 = real security gate passed; 3 = real client journey
          passed.\n\n'+json.dumps(choices,indent=2)+'\n\n'+'\n\n'.join(logs)

          (root/'repair-context.md').write_text(context)

          (root/'previous-worker'/'failed.log').write_text(context)

          print('Prepared',len(choices),'bounded, tested source candidates; generated/cache artifacts excluded.')


          PY
      - name: Restore strongest tested candidate without credentials
        if: env.MODE == 'work'
        run: >
          set -euo pipefail

          python3 - <<'PY'

          import json, subprocess

          from pathlib import Path


          data=Path('.opencode-ci/repair-selection.json')

          choices=json.loads(data.read_text()) if data.exists() else []

          filters=['--exclude=*.jar','--exclude=*.zip','--exclude=*.apk','--exclude=*.db','--exclude=*.sqlite','--exclude=*.log','--exclude=*.pyc','--exclude=**/node_modules/**','--exclude=docs/source-history/**','--exclude=**/.env*']

          for prefix in ['src','app','tests','backend','backend-tests','firebase','plugins','scripts','docs','assets','deploy']:
              filters.append('--include='+prefix+'/**')
          for name in
          ['package.json','package-lock.json','app.json','firebase.json','.firebaserc','.gitignore','README.md','VERIFICATION.md','.github/workflows/android-apk.yml']:
              filters.append('--include='+name)
          assert subprocess.run(['git','diff','--quiet']).returncode == 0, 'Unexpected existing source edits before recovery'

          assert subprocess.run(['git','diff','--cached','--quiet']).returncode == 0, 'Unexpected staged edits before recovery'

          restored=None

          for choice in choices:
              args=['git','apply','--whitespace=nowarn',*filters,choice['patch']]
              if subprocess.run(args[:2]+['--reverse','--check',*args[2:]],capture_output=True).returncode == 0: continue
              check=subprocess.run(args[:2]+['--check','--index',*args[2:]],capture_output=True,text=True)
              if check.returncode: continue
              subprocess.run(args[:2]+['--index',*args[2:]],check=True)
              restored=choice
              print('Restored candidate:',json.dumps(choice))
              break
          Path('.opencode-ci/restored-candidate.json').write_text(json.dumps(restored,indent=2)+'\n')

          if restored is None: print('No clean candidate applied; patches retained for the agent to reconcile. No destructive
          reset.')


          PY

          if ! git diff --cached --quiet -- package.json package-lock.json; then npm ci --no-audit --no-fund; fi
      - name: Java for real Firestore security gate
        if: env.MODE == 'work'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache official emulator
        uses: actions/cache@v4
        with:
          path: '${{ runner.temp }}/firestore-emulators'
          key: firestore-emulator-1.19.8
        if: env.MODE == 'work'
        id: firestore_cache
      - name: OpenCode implements the next verified product slice
        if: env.MODE == 'work'
        timeout-minutes: 26
        run: >
          set -euo pipefail

          timeout 1500 opencode run --agent build --model opencode/big-pickle --format json "PRIORITY: read
          .opencode-ci/repair-context.md and restored-candidate.json first. The strongest tested source is already restored; do
          not restart from baseline or apply an older regression. Fix the first still-failing acceptance gate shown in
          repair-context. When Firebase is not yet validated, check raw resource names in commit JSON versus encoded HTTP URLs and
          real Node HTTP under jest-expo. Once Firebase passes, fix the latest native failure and then the remaining product
          criteria. Do not change Git metadata/history; the runner owns commits. Do not write another audit. Preserve security
          checks and zero billing. Then follow the mission and newest issue instructions.

          $(cat .github/OPENCODE_MISSION.md)" | tee "$RUNNER_TEMP/opencode-work.jsonl"

          python3 - <<'PYWORK'

          import json,os

          events=[]

          for line in open(os.environ['RUNNER_TEMP']+'/opencode-work.jsonl'):
            try: events.append(json.loads(line))
            except ValueError: pass
          assert not any(e.get('type')=='error' for e in events), 'OpenCode worker reported a session error'

          assert any(e.get('type')=='text' for e in events), 'No worker response received'

          PYWORK
      - name: Preserve execution controls while retaining product work
        if: env.MODE == 'work'
        run: >
          set -euo pipefail

          base=$(cat "$RUNNER_TEMP/opencode-base-head")

          git diff --binary "$base" -- .github/workflows/opencode.yml opencode.json .github/OPENCODE_MISSION.md >
          "$RUNNER_TEMP/opencode-rejected-controls.patch"

          if [ -s "$RUNNER_TEMP/opencode-rejected-controls.patch" ]; then
            echo '::warning::Worker edits to its execution controls were rejected and preserved as evidence; restoring the authorized baseline before testing product changes.'
            git restore --source="$base" --staged --worktree -- .github/workflows/opencode.yml opencode.json .github/OPENCODE_MISSION.md
          fi
      - name: Stage only product source and squash unpublished agent commits
        if: env.MODE == 'work'
        run: >
          set -euo pipefail

          python3 - <<'PY'

          import os, subprocess

          from pathlib import Path


          base=(Path(os.environ['RUNNER_TEMP'])/'opencode-base-head').read_text().strip()

          subprocess.run(['git','cat-file','-e',base+'^{commit}'],check=True)

          # Only local, unpublished agent commits in this fresh runner are squashed.

          subprocess.run(['git','reset','--soft',base],check=True)

          raw=subprocess.check_output(['git','diff','--name-only','-z',base]).split(b'\0')

          raw+=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).split(b'\0')

          prefixes={'src','app','tests','backend','backend-tests','firebase','plugins','scripts','docs','assets','deploy'}

          roots={'package.json','package-lock.json','app.json','firebase.json','.firebaserc','.gitignore','README.md','VERIFICATION.md','.github/workflows/android-apk.yml'}

          generated={'.jar','.zip','.apk','.db','.sqlite','.log','.pyc','.class','.heapsnapshot'}

          for encoded in sorted(set(raw)):
              if not encoded: continue
              name=encoded.decode();path=Path(name)
              allowed=(name in roots or (path.parts and path.parts[0] in prefixes))
              allowed=allowed and not name.startswith('docs/source-history/') and path.suffix not in generated
              allowed=allowed and not any(part in {'.git','node_modules','.cache','.opencode-ci','__pycache__'} for part in path.parts)
              allowed=allowed and not (path.name.startswith('.env') and path.name!='.env.example')
              allowed=allowed and name!='docs/CROSS_REPOSITORY_REQUIREMENTS.md'
              if path.exists() and (path.is_symlink() or path.is_file() and path.stat().st_size>5*1024*1024): allowed=False
              if allowed:
                  subprocess.run(['git','add','-A','--',name],check=True)
              elif subprocess.run(['git','cat-file','-e',base+':'+name],capture_output=True).returncode == 0:
                  subprocess.run(['git','restore','--source='+base,'--staged','--worktree','--',name],check=True)
              else:
                  subprocess.run(['git','rm','--cached','--ignore-unmatch','--',name],check=True,stdout=subprocess.DEVNULL)
                  print('Excluded generated or non-product path:',name)

          PY
      - name: Verify proposed source changes
        if: env.MODE == 'work'
        run: >
          python3 - <<'PY'

          import subprocess

          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()

          roots={'app.json','package.json','package-lock.json','firebase.json','.firebaserc','.github/workflows/android-apk.yml'}

          assert
          any(p.startswith(('src/','app/','backend/','backend-tests/','tests/','firebase/','plugins/','scripts/','assets/')) or p
          in roots for p in paths), 'No product or executable test/config change: a status report alone is not a repair'

          PY

          set -euo pipefail

          npm run typecheck

          npm test

          npm run test:backend

          git diff --check
      - name: Prepare isolated demo project and hostile requests
        run: >
          mkdir -p /tmp/chorescore-audit-firestore

          cp firebase/firestore.rules /tmp/chorescore-audit-firestore/firestore.rules

          cat > /tmp/chorescore-audit-firestore/firebase.json <<'JSON'

          {"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"host":"127.0.0.1","port":8181},"ui":{"enabled":false},"singleProjectMode":true}}

          JSON

          cat > /tmp/chorescore-audit-firestore/audit.py <<'PY'

          import atexit, base64, copy, json, time, urllib.request, urllib.error

          from pathlib import Path


          PROJECT = 'demo-chorescore-audit'

          BASE = f'http://127.0.0.1:8181/v1/projects/{PROJECT}/databases/(default)/documents'

          results = []

          atexit.register(lambda:
          Path("/tmp/chorescore-audit-firestore/results.json").write_text(json.dumps(results,indent=2)+"\n"))


          def encode(x):
              if x is None: return {'nullValue': None}
              if isinstance(x, bool): return {'booleanValue': x}
              if isinstance(x, int): return {'integerValue': str(x)}
              if isinstance(x, str): return {'stringValue': x}
              if isinstance(x, list): return {'arrayValue': {'values': [encode(v) for v in x]}}
              return {'mapValue': {'fields': {k: encode(v) for k, v in x.items()}}}

          def token(uid):
              def b(x): return base64.urlsafe_b64encode(json.dumps(x).encode()).decode().rstrip('=')
              now = int(time.time())
              return b({'alg':'none','typ':'JWT'}) + '.' + b({'sub':uid,'user_id':uid,'aud':PROJECT,'iss':'https://securetoken.google.com/'+PROJECT,'iat':now,'auth_time':now,'exp':now+3600,'firebase':{'sign_in_provider':'custom','identities':{}}}) + '.'

          def call(method, path, body=None, uid='owner'):
              req = urllib.request.Request(BASE+path, data=None if body is None else json.dumps(body).encode(), method=method,
                  headers={'Authorization':'Bearer '+('owner' if uid == 'owner' else token(uid)), 'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return r.status, json.load(r) if method != 'DELETE' else None
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read())
              except (TimeoutError, urllib.error.URLError) as e:
                  return 599, {"error":{"message":str(e)}}

          def put(path, obj, uid='owner'):
              return call('PATCH', path, {'fields': {k:encode(v) for k,v in obj.items()}},uid)

          group = {'id':'home','ownerId':'alice','createdAt':'2026-10-26T00:00:00Z','revision':1,
              'memberUids':['alice','bob'], 'access':{'alice':{'role':'OWNER','memberId':'owner-member'},'bob':{'role':'MEMBER','memberId':'bob-member'}},
              'household':{'id':'home','ownerId':'alice','name':'Audit','contributionUnit':'points'}}
          assert put('/groups/home',group)[0] == 200


          status, _ = call('GET','/groups/home',uid='bob')

          results.append({'case':'normal_member_can_read_group','expected':200,'actual':status})

          status, _ = call('GET','/groups/home',uid='stranger')

          results.append({'case':'unrelated_account_read','expected':403,'actual':status})


          # A normal member bypasses owner-only client settings and all version checks.

          status, _ = put('/groups/home/records/households_home', {
              'collection':'households','id':'home','version':999,
              'value':{'id':'home','ownerId':'bob','name':'Forged','crossLedgerCompensationEnabled':True}}, 'bob')
          results.append({'case':'non_owner_forges_household_record','expected':403,'actual':status})


          # Events are not linked to a group revision or validated record changes.

          status, _ = put('/groups/home/events/999', {'revision':999,'changes':[{
              'collection':'expense_entries','id':'other-tenant-entry','version':1,
              'value':{'id':'other-tenant-entry','householdId':'unrelated-group','amountMinor':999999}}]}, 'bob')
          results.append({'case':'member_injects_cross_tenant_event_payload','expected':403,'actual':status})


          # The raw write can reopen a completed todo and doesn't require a ledger pair.

          assert
          put('/groups/home/records/todo_items_done',{'collection':'todo_items','id':'done','version':1,'value':{'id':'done','householdId':'home','status':'completed'}})[0]
          == 200

          status, _ =
          put('/groups/home/records/todo_items_done',{'collection':'todo_items','id':'done','version':1,'value':{'id':'done','householdId':'home','status':'todo'}},'bob')

          results.append({'case':'member_reopens_completed_todo_raw','expected':403,'actual':status})


          # A member can delete a photo even while an entry still references it.

          assert put('/groups/home/media/photo',{'uploadedBy':'alice','data':'AA==','sha256':'sample'})[0] == 200

          assert
          put('/groups/home/records/expense_entries_ref',{'collection':'expense_entries','value':{'householdId':'home','attachments':[{'remoteRef':'photo'}]}})[0]
          == 200

          status, _ = call('DELETE','/groups/home/media/photo',uid='bob')

          results.append({'case':'member_deletes_referenced_private_photo','expected':403,'actual':status})


          # A targeted invitation for bob is used to claim alice's ledger identity.

          assert
          put('/groups/home/records/members_target-member',{'id':'target-member','collection':'members','version':1,'updatedAt':group['createdAt'],'value':{'id':'target-member','householdId':'home','name':'Charlie','userId':None,'joinedAt':group['createdAt']}})[0]
          == 200

          invite_hash = 'a'*64

          assert
          put('/groups/home/invites/'+invite_hash,{'groupId':'home','memberId':'target-member','revoked':False,'expiresAt':int(time.time()*1000)+3600000,'acceptedBy':None})[0]
          == 200

          status, _ =
          put('/joinRequests/home_eve',{'uid':'eve','groupId':'home','inviteHash':invite_hash,'createdAt':'2026-10-26T00:00:00Z'},'eve')

          assert status == 200, status

          joined = copy.deepcopy(group)

          joined['revision'] += 1

          joined['memberUids'].append('eve')

          joined['access']['eve'] = {'role':'MEMBER','memberId':'owner-member','inviteHash':invite_hash}

          status, _ = put('/groups/home',joined,'eve')

          results.append({'case':'targeted_invite_claims_wrong_member_id','expected':403,'actual':status})


          print(json.dumps(results,indent=2),flush=True)


          PY
        if: env.MODE == 'work'
      - name: Execute actual Firestore emulator and security rules
