  diagnostic:
    name: Diagnostic des blocages et candidats conservés
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnostic')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check current product branch for recovery test
        uses: actions/checkout@v4
        with:
          ref: feat/product-reconstruction
          persist-credentials: false
      - name: Choose strongest retained source candidate
        env:
          GH_TOKEN: '${{ github.token }}'
          RECOVERY_SOURCE_RUN_ID: '${{ inputs.diagnostic_run }}'
        run: >
          python3 - <<'PY'

          import datetime, io, json, os, re, subprocess, zipfile

          from pathlib import Path


          root = Path('.opencode-ci')

          (root/'candidates').mkdir(parents=True, exist_ok=True)

          (root/'current-batch').mkdir(exist_ok=True)

          (root/'previous-worker').mkdir(exist_ok=True)

          repo = os.environ['GITHUB_REPOSITORY']

          current = os.environ.get('RECOVERY_SOURCE_RUN_ID', os.environ['GITHUB_RUN_ID'])

          assert current.isdigit(), 'Invalid source run identifier'


          def api(path):
              return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+path]))

          def stamp(s):
              return datetime.datetime.fromisoformat(s.replace('Z','+00:00'))

          def quality(job):
              steps = {s['name']:s.get('conclusion') for s in job.get('steps',[])}
              if steps.get('Verify proposed source changes') != 'success': return 0
              if steps.get('Require integrated Firebase emulator journey') == 'success': return 3
              if steps.get('Require hostile writes to be rejected') == 'success': return 2
              return 1

          runs =
          json.loads(subprocess.check_output(['gh','run','list','--workflow','opencode.yml','--limit','40','--json','databaseId,conclusion']))

          ids = [current] + [str(r['databaseId']) for r in runs if r['conclusion'] in ('failure','cancelled') and
          str(r['databaseId']) != current]

          ranked, summary, eligible = [], [], 0

          for run in ids:
              jobs = api(f'actions/runs/{run}/jobs?per_page=100')['jobs']
              work = [j for j in jobs if j['name'].startswith('opencode (')]
              if not work: continue
              good = [j for j in work if quality(j) and j.get('completed_at')]
              summary.extend({'run':run,'job':j['name'],'quality':quality(j),'conclusion':j.get('conclusion')} for j in work)
              if not good: continue
              artifacts = api(f'actions/runs/{run}/artifacts?per_page=100')['artifacts']
              for artifact in artifacts:
                  if artifact['expired'] or not artifact['name'].startswith('OpenCode-worker-evidence') or artifact['size_in_bytes'] > 16*1024*1024: continue
                  created = stamp(artifact['created_at'])
                  for job in good:
                      if stamp(job['started_at']) <= created <= stamp(job['completed_at']) + datetime.timedelta(seconds=5):
                          ranked.append((quality(job),artifact['created_at'],run,job,artifact,artifacts))
              eligible += 1
              if eligible >= 3: break

          choices, logs = [], []

          for score,created,run,job,artifact,artifacts in sorted(ranked,key=lambda x:(x[0],x[1]),reverse=True):
              data = subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{artifact["id"]}/zip'])
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  files=[i for i in z.infolist() if Path(i.filename).name=='opencode-proposed.patch' and 0 < i.file_size <= 8*1024*1024]
                  if not files: continue
                  target=root/'candidates'/f'{run}-{artifact["id"]}.patch'
                  target.write_bytes(z.read(files[0]))
              choice={'run':run,'job':job['name'],'quality':score,'artifact':artifact['id'],'createdAt':created,'patch':str(target)}
              choices.append(choice)
              passage=re.search(r'\((\d+)\)',job['name']).group(1)
              gate=next((a for a in artifacts if a['name']==f'Firestore-security-gate-{passage}' and not a['expired'] and a['size_in_bytes'] < 16*1024*1024),None)
              if gate:
                  raw=subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{gate["id"]}/zip'])
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      for name in z.namelist():
                          if Path(name).name not in ('client-journey.log','execution.log'): continue
                          text=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',z.read(name).decode(errors='replace'))
                          lines=[line for line in text.splitlines() if len(line)<1600 and re.search(r'FAIL|Error|denied|permission|evaluation|Tests:|Test Suites:| at |undefined|Missing',line,re.I)]
                          excerpt='\n'.join(lines[-25:])+'\n'+text[-1200:]
                          logs.append(f'## {run} {job["name"]} {Path(name).name}\n{excerpt}')
              if len(choices)>=3: break

          (root/'repair-selection.json').write_text(json.dumps(choices,indent=2)+'\n')

          (root/'current-batch'/'status.json').write_text(json.dumps(summary,indent=2)+'\n')

          context='# Repair handoff — restore the strongest candidate, not the latest regression\n\nQuality 1 = source tests
          passed; 2 = real security gate passed; 3 = real client journey
          passed.\n\n'+json.dumps(choices,indent=2)+'\n\n'+'\n\n'.join(logs)

          (root/'repair-context.md').write_text(context)

          (root/'previous-worker'/'failed.log').write_text(context)

          print('Prepared',len(choices),'bounded, tested source candidates; generated/cache artifacts excluded.')


          PY
      - name: Validate source restoration without running or publishing product code
        run: >
          python3 - <<'PY'

          import json, subprocess

          from pathlib import Path


          data=Path('.opencode-ci/repair-selection.json')

          choices=json.loads(data.read_text()) if data.exists() else []

          filters=['--exclude=*.jar','--exclude=*.zip','--exclude=*.apk','--exclude=*.db','--exclude=*.sqlite','--exclude=*.log','--exclude=*.pyc','--exclude=**/node_modules/**','--exclude=docs/source-history/**','--exclude=**/.env*']

          for prefix in ['src','app','tests','backend','backend-tests','firebase','plugins','scripts','docs','assets','deploy']:
              filters.append('--include='+prefix+'/**')
          for name in
          ['package.json','package-lock.json','app.json','firebase.json','.firebaserc','.gitignore','README.md','VERIFICATION.md','.github/workflows/android-apk.yml']:
              filters.append('--include='+name)
          assert subprocess.run(['git','diff','--quiet']).returncode == 0, 'Unexpected existing source edits before recovery'

          assert subprocess.run(['git','diff','--cached','--quiet']).returncode == 0, 'Unexpected staged edits before recovery'

          restored=None

          for choice in choices:
              args=['git','apply','--whitespace=nowarn',*filters,choice['patch']]
              if subprocess.run(args[:2]+['--reverse','--check',*args[2:]],capture_output=True).returncode == 0: continue
              check=subprocess.run(args[:2]+['--check','--index',*args[2:]],capture_output=True,text=True)
              if check.returncode: continue
              subprocess.run(args[:2]+['--index',*args[2:]],check=True)
              restored=choice
              print('Restored candidate:',json.dumps(choice))
              break
          Path('.opencode-ci/restored-candidate.json').write_text(json.dumps(restored,indent=2)+'\n')

          if restored is None: print('No clean candidate applied; patches retained for the agent to reconcile. No destructive
          reset.')


          import json

          result=json.loads(Path('.opencode-ci/restored-candidate.json').read_text())

          assert result is not None, 'No retained candidate could be restored'

          print('::notice::RESTORED '+json.dumps(result))

          PY

          git diff --cached --stat
      - name: Preserve recovery proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Verified-candidate-recovery
          path: .opencode-ci/
          include-hidden-files: true
          retention-days: 3
