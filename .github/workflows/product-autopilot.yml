name: Product reconstruction

on:
  push:
    branches: [feat/product-reconstruction]
    paths-ignore: ['VERIFICATION.md', 'docs/evidence/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chorescore-single-product-writer
  cancel-in-progress: false

jobs:
  reconstruct:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/product-reconstruction
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked dependencies and real browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          echo "CHROME_BIN=$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Preserve exact latest failing check context
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/diagnose-previous-run.py
      - name: Install verified historical OpenCode binary and require zero pricing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          curl --fail --location --retry 2 https://github.com/anomalyco/opencode/releases/download/v1.19.4/opencode-linux-x64.tar.gz -o "$RUNNER_TEMP/opencode.tar.gz"
          printf '%s  %s\n' 849bd6b3d959a1d2ef200ed1634a51c79a45ca236aa26665d75debd694805cce "$RUNNER_TEMP/opencode.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-bin"
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"
          curl --fail --location https://raw.githubusercontent.com/anomalyco/models.dev/dev/providers/opencode/models/big-pickle.toml -o "$RUNNER_TEMP/model.toml"
          python3 - <<'PY'
          import os,tomllib
          with open(os.environ['RUNNER_TEMP']+'/model.toml','rb') as f: model=tomllib.load(f)
          assert model['cost']['text']['input']['price']==0, 'Input model pricing is not zero'
          assert model['cost']['text']['output']['price']==0, 'Output model pricing is not zero'
          PY
      - name: Require a real free model response
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 240 opencode run --model opencode/big-pickle --format json 'Reply exactly OPENCODE_FREE_OK. Do not use tools or edit files.' > "$RUNNER_TEMP/model-health.jsonl"
          python3 - <<'PY'
          import json,os
          events=[]
          for line in open(os.environ['RUNNER_TEMP']+'/model-health.jsonl'):
            try: events.append(json.loads(line))
            except ValueError: pass
          assert not any(e.get('type')=='error' for e in events), 'Free model returned an error'
          text=''.join(e.get('part',{}).get('text','') for e in events if e.get('type')=='text')
          assert 'OPENCODE_FREE_OK' in text, 'No actual free inference; do not pretend a worker ran'
          print('::notice::Free OpenCode inference actually answered; starting product reconstruction.')
          PY
      - name: Audit, implement and iterate against independent product gates
        run: python3 scripts/ci/product-autopilot.py
      - name: Expose concrete iteration outcome
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file=Path('verification-evidence/autopilot/iterations.json')
          text=file.read_text() if file.exists() else 'Worker did not reach an implementation iteration. Inspect the failed setup/health step.'
          print('::notice title=Product reconstruction outcome::'+text[-12000:].replace('%','%25').replace('\n','%0A'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-reconstruction-${{ github.run_id }}
          path: |
            verification-evidence/autopilot/
            verification-evidence/android/
            verification-evidence/firestore/
            .opencode-ci/latest-checks.md
          include-hidden-files: true
          retention-days: 3

  integrate:
    needs: reconstruct
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/product-reconstruction
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: product-reconstruction-${{ github.run_id }}
          path: candidate
      - name: Integrate verified product changes without replacing concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=$(cat candidate/verification-evidence/autopilot/base.txt)
          test "$(git rev-parse HEAD)" = "$base"
          git apply --check --index candidate/verification-evidence/autopilot/verified.patch
          git apply --index candidate/verification-evidence/autopilot/verified.patch
          git diff --cached --quiet && exit 1
          python3 - <<'PY'
          import pathlib,subprocess
          baseline=set(subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines())
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          for name in paths:
            p=pathlib.Path(name)
            allowed=name in {'VERIFICATION.md','app.json'} or p.parts[0] in {'src','app','backend','firebase','plugins','assets'} or (p.parts[0] in {'tests','backend-tests'} and name not in baseline)
            assert allowed and not p.is_symlink(), 'Rejected non-product or protected path: '+name
          assert any(p.startswith(('src/','app/','backend/','firebase/','plugins/','assets/')) or p=='app.json' for p in paths), 'Report-only publication rejected'
          PY
          git config user.name 'ChoreScore product worker'
          git config user.email 'chorescore-worker@users.noreply.github.com'
          git commit -m "Implement independently verified product slice from reconstruction $GITHUB_RUN_ID"
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:feat/product-reconstruction
