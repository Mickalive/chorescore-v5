name: Android candidate APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chorescore-v5-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript verification
        run: npm run typecheck
      - name: Build release-mode Android APK
        run: |
          set -euo pipefail
          unset EXPO_PUBLIC_E2E_AUTH
          npx --no-install expo prebuild --platform android --no-install --clean
          (cd android && ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon)
          apk=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -n "$apk" && test -s "$apk"
          mkdir -p release
          cp "$apk" release/ChoreScore-V5.apk
          unzip -t release/ChoreScore-V5.apk | tail -1
          unzip -Z1 release/ChoreScore-V5.apk | grep -q '^lib/arm64-v8a/'
          sha256sum release/ChoreScore-V5.apk > release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChoreScore-V5-APK
          path: release/
          if-no-files-found: error
          retention-days: 14
