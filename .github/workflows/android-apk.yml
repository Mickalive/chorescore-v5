name: Android candidate APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      firebase_only:
        description: Vérifier Firebase sans reconstruire un APK déjà en cours
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: chorescore-v5-apk-${{ github.event.pull_request.number || github.ref }}${{ inputs.firebase_only && '-firebase' || '' }}
  cancel-in-progress: true

jobs:
  firebase:
    name: Firebase collaboration on persistent SQLite clients
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: demo-chorescore-audit
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: demo-chorescore-audit
      FIREBASE_EMULATORS_PATH: ${{ runner.temp }}/firestore-emulators
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/firestore-emulators
          key: chorescore-firestore-1.19.8
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify real Firebase rules, deltas and SQLite restart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firebase-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('firebase-evidence')
          (root/'firestore.rules').write_text(Path('firebase/firestore.rules').read_text())
          (root/'firebase.json').write_text(json.dumps({
            'firestore': {'rules':'firestore.rules'},
            'emulators': {'firestore':{'port':8080},'ui':{'enabled':False},'singleProjectMode':True}
          }))
          PY
          npm exec --yes --package=firebase-tools@14.22.0 -- firebase emulators:exec \
            --project demo-chorescore-audit --config firebase-evidence/firebase.json --only firestore \
            'npm test -- --runTestsByPath tests/firebaseEmulator.test.ts --json --outputFile=firebase-evidence/results.json' \
            2>&1 | tee firebase-evidence/journey.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('firebase-evidence/results.json').read_text())
          assert data['numPassedTests'] > 0, 'No Firebase journey executed'
          assert data['numFailedTests'] == 0, 'Firebase journey failed'
          assert data['numPendingTests'] == 0, 'Firebase journey was skipped'
          print('Verified real Firebase journey with persistent SQLite and restart, no skipped tests.')
          PY
      - name: Expose actual Firebase failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('firebase-evidence/results.json')
          if path.exists():
            import json
            data=json.loads(path.read_text())
            for suite in data.get('testResults',[]):
              if suite.get('status')=='failed':
                message=suite.get('message','Firebase test suite failed')[-6000:]
                message=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                print('::error title=Firebase integration failure::'+message)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Firebase-SQLite-evidence
          path: firebase-evidence/
          if-no-files-found: warn
          retention-days: 7
  android:
    if: ${{ !inputs.firebase_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_COLLAB_URL: ${{ vars.EXPO_PUBLIC_COLLAB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript verification
        run: npm run typecheck
      - name: Domain and disk-backed SQLite integration tests
        run: npm test
      - name: Collaboration server HTTP integration tests
        run: npm run test:backend
      - name: Build release-mode Android APK
        run: |
          set -euo pipefail
          unset EXPO_PUBLIC_E2E_AUTH
          npx --no-install expo prebuild --platform android --no-install --clean
          (cd android && ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --max-workers=2 --no-daemon)
          apk=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          test -n "$apk" && test -s "$apk"
          mkdir -p release
          cp "$apk" release/ChoreScore-V5.apk
          unzip -t release/ChoreScore-V5.apk | tail -1
          unzip -Z1 release/ChoreScore-V5.apk > release/APK-CONTENTS.txt
          grep -q '^lib/arm64-v8a/' release/APK-CONTENTS.txt
          grep -q '^lib/x86_64/' release/APK-CONTENTS.txt
          sha256sum release/ChoreScore-V5.apk > release/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChoreScore-V5-APK
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Enable hardware acceleration for native acceptance
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Verify installed release APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/android/verify-device.py release/ChoreScore-V5.apk
      - name: Preserve actual native evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChoreScore-Android-evidence
          path: android-evidence/
          if-no-files-found: warn
          retention-days: 14
